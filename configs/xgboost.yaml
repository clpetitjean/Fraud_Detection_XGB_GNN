# Paramètres utilisés si l'optimisation est désactivée,
# et valeurs de base complétées par l'optimisation sinon
params:
  device: cuda
  n_estimators: 2000
  learning_rate: 0.05
  max_depth: 8
  subsample: 0.8
  colsample_bytree: 0.5
  early_stopping_rounds: 100
  random_state: 0

tuning:
  enabled: true       # true pour lancer l'optimisation
  sampler: tpe          # tpe ou gp (processus gaussien)
  n_trials: 20
  timeout_minutes: 90  # arrêt même si n_trials n'est pas atteint
  search_space:
    learning_rate:    {type: float, low: 0.01,  high: 0.3,  log: true}
    max_depth:        {type: int,   low: 3,     high: 12}
    min_child_weight: {type: float, low: 1,     high: 20,   log: true}
    subsample:        {type: float, low: 0.5,   high: 1.0}
    colsample_bytree: {type: float, low: 0.3,   high: 1.0}
    gamma:            {type: float, low: 1.0e-8,   high: 5.0}
    reg_lambda:       {type: float, low: 0.001, high: 10,   log: true}
    reg_alpha:        {type: float, low: 0.001, high: 10,   log: true}